<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ANJANAM — shop products, digital articles, videos, books, and music online in India. Secure Razorpay checkout on web and Android.">
  <meta name="robots" content="index,follow">
  <meta name="keywords" content="ANJANAM, online shopping, ecommerce India, digital articles, videos, books, music, Razorpay">
  <link rel="canonical" href="https://anjanam.store/">
  <meta property="og:title" content="ANJANAM — Shop Online in India">
  <meta property="og:description" content="Discover products, articles, videos, books, and music on ANJANAM. Shop on the web or Android app.">
  <meta property="og:image" content="https://anjanam.store/icons/Icon-512.png">
  <meta property="og:url" content="https://anjanam.store/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ANJANAM">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ANJANAM — Shop Online in India">
  <meta name="twitter:description" content="Discover products, articles, videos, books, and music on ANJANAM.">
  <meta name="twitter:image" content="https://anjanam.store/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ANJANAM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ANJANAM — Shop Online in India</title>
  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ANJANAM",
    "url": "https://anjanam.store",
    "logo": "https://anjanam.store/icons/Icon-512.png",
    "email": "support.anjanam@gmail.com"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ANJANAM",
    "url": "https://anjanam.store",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://anjanam.store/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <!-- Per-route OG tags for /product, /video, /article share links (before Flutter loads). -->
  <script src="seo-bootstrap.js" defer></script>
  <!-- Razorpay Standard Checkout (Flutter web uses checkout.js; see lib/core/payments/razorpay_service_web.dart). -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" crossorigin="anonymous" referrerpolicy="strict-origin-when-cross-origin"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
