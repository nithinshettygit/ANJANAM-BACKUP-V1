# Edge JWT verification uses the project JWT secret. Sessions from publishable keys
# (sb_publishable_…) / ES256 are often rejected at the gateway with 401 before this
# function runs (execution_id null in logs). We authenticate inside the function.
[functions.send-notification]
verify_jwt = false

[functions.create_payment_order]
verify_jwt = false

[functions.create-razorpay-order]
verify_jwt = false

[functions.verify_payment]
verify_jwt = false

[functions.verify-razorpay-payment]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.razorpay_webhook]
verify_jwt = false

[functions.create_shiprocket_shipment]
verify_jwt = false

[functions.sync_shiprocket_shipment_status]
verify_jwt = false

[functions.refund-payment]
verify_jwt = false
